<h1>{{ name }}</h1>

<dl>
  <td>Nombre:</td>
  <dd>{{ name }}</dd>

  <td>Edad:</td>
  <dd>{{ age }}</dd>

  <td>Método:</td>
  <dd>{{ getHeroDescription() }}</dd>

  <td>Capitalizado:</td>
  <dd>{{ capitalizedName }}</dd>
</dl>

<div class="d-flex gap-3">
  <button
    *ngIf="name !== 'Batman'"
    class="btn btn-primary"
    (click)="changeHero()"
  >
    Cambiar nombre
  </button>

  <button
    *ngIf="age === 45"
    class="btn btn-primary"
    (click)="changeAge()"
  >
    Cambiar edad
  </button>
</div>
